name: Package Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate popup JavaScript syntax
        run: node --check popup.js

      - name: Run extension sanity checks
        run: node scripts/validate-extension.mjs

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $distDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $version = $env:GITHUB_REF_NAME

          Compress-Archive -Path manifest.json, popup.html, popup.js, README.md -DestinationPath (Join-Path $distDir "sonar-ai-prompter-$version.zip") -Force

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sonar-ai-prompter-${{ github.ref_name }}.zip
